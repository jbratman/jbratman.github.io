<section class="project-process">
  <div class="project-section-heading">
    <p class="project-kicker">Engineering Process</p>
    <h2>{{ page.process_heading | default: "From requirements to validated hardware" }}</h2>
  </div>

  <ol class="project-process__track">
    {% for step in page.process %}
      <li>
        <span class="project-process__number">{{ forloop.index | prepend: '0' }}</span>
        <strong>{{ step.title }}</strong>
        {% if step.detail %}
          <p>{{ step.detail }}</p>
        {% endif %}
      </li>
    {% endfor %}
  </ol>
</section>
